<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Pesquisa CEP</title>
</head>

<body>

    <div class="bg-primary text-white text-center py-4 mb-4">
        <div class="container">
            <h1>Formulário consumindo API ViaCep</h1>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card">
                    <div class="card-body">
                        <h2 class="text-center mb-4">Informe o CEP</h2>
                        <p class="text-center text-muted mb-4">
                            Preencha o Formulário.
                        </p>
                        <form method="post">
                            <!-- CEP -->
                            <div class="mb-3">
                                <label for="cep" class="form-label fw-bold">CEP</label>
                                <input type="text" id="cep" name="cep" value="" maxlength="9" class="form-control"
                                    placeholder="00000-000" onblur="pesquisacep(this.value);">
                            </div>

                            <!-- Rua -->
                            <div class="mb-3">
                                <label for="rua" class="form-label fw-bold">Rua</label>
                                <input type="text" id="rua" name="rua" class="form-control" placeholder="Digite a rua">
                            </div>

                            <!-- Bairro -->
                            <div class="mb-3">
                                <label for="bairro" class="form-label fw-bold">Bairro</label>
                                <input type="text" id="bairro" name="bairro" class="form-control"
                                    placeholder="Digite o bairro">
                            </div>

                            <!-- Cidade -->
                            <div class="mb-3">
                                <label for="cidade" class="form-label fw-bold">Cidade</label>
                                <input type="text" id="cidade" name="cidade" class="form-control"
                                    placeholder="Digite a cidade">
                            </div>

                            <!-- Estado -->
                            <div class="mb-3">
                                <label for="uf" class="form-label fw-bold">Estado</label>
                                <input type="text" id="uf" name="uf" class="form-control" placeholder="Digite o estado">
                            </div>

                            <!-- IBGE -->
                            <div class="mb-3">
                                <label for="ibge" class="form-label fw-bold">IBGE</label>
                                <input type="text" id="ibge" name="ibge" class="form-control"
                                    placeholder="Digite o IBGE">
                            </div>

                            <!-- Botao -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Enviar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        // Formatação do campo CEP
        const input = document.getElementById("cep");

        input.addEventListener("input", function (e) {
            // Remove tudo que não é dígito
            let v = e.target.value.replace(/\D/g, "");
            // Adiciona o hífen após os 5 primeiros dígitos
            v = v.replace(/(\d{5})(\d)/, "$1-$2");
            // Limita a 9 caracteres (5 dígitos + hífen + 3 dígitos)
            e.target.value = v.substring(0, 9);
        });

        function limpa_formulário_cep() {
            //Limpa valores do formulário de cep.
            document.getElementById('rua').value = ("");
            document.getElementById('bairro').value = ("");
            document.getElementById('cidade').value = ("");
            document.getElementById('uf').value = ("");
            document.getElementById('ibge').value = ("");
        }

        function meu_callback(conteudo) {
            if (!("erro" in conteudo)) {
                //Atualiza os campos com os valores.
                document.getElementById('rua').value = (conteudo.logradouro);
                document.getElementById('bairro').value = (conteudo.bairro);
                document.getElementById('cidade').value = (conteudo.localidade);
                document.getElementById('uf').value = (conteudo.uf);
                document.getElementById('ibge').value = (conteudo.ibge);
            } //end if.
            else {
                //CEP não Encontrado.
                limpa_formulário_cep();
                alert("CEP não encontrado.");
            }
        }

        // Função para pesquisar o CEP quando apertar o botão TAB ou ENTER
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.querySelector("form");
            form.addEventListener("submit", function (e) {
                e.preventDefault(); // Evita o envio do formulário
                const cep = document.getElementById("cep").value;
                if (cep.trim() === "") {
                    alert("Por favor, preencha o campo CEP.");
                    return;
                }
                pesquisacep(cep);
            });
        });

        function pesquisacep(valor) {
            //Nova variável "cep" somente com dígitos.
            var cep = valor.replace(/\D/g, '');

            //Verifica se campo cep possui valor informado.
            if (cep != "") {

                //Expressão regular para validar o CEP.
                var validacep = /^[0-9]{8}$/;

                //Valida o formato do CEP.
                if (validacep.test(cep)) {

                    //Preenche os campos com "..." enquanto consulta webservice.
                    document.getElementById('rua').value = "...";
                    document.getElementById('bairro').value = "...";
                    document.getElementById('cidade').value = "...";
                    document.getElementById('uf').value = "...";
                    document.getElementById('ibge').value = "...";

                    //Cria um elemento javascript.
                    var script = document.createElement('script');

                    //Sincroniza com o callback.
                    script.src = 'https://viacep.com.br/ws/' + cep + '/json/?callback=meu_callback';

                    //Insere script no documento e carrega o conteúdo.
                    document.body.appendChild(script);

                } //end if.
                else {
                    //cep é inválido.
                    limpa_formulário_cep();
                    alert("Formato de CEP inválido.");
                }
            } //end if.
            else {
                //cep sem valor, limpa formulário.
                limpa_formulário_cep();
            }
        };
    </script>
</body>

</html>
