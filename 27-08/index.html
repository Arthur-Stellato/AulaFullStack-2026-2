<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<div class="bg-primary text-white text-center py-4 mb-4">
    <div class="container">
        <div class="row">
            <div class="card">
                <div class="card-body">
                    <p class="text-center text-muted mb-4">
                        Preencha as notas.
                    </p>
                    <form action="resultado.html" onsubmit="resultado(event)">
                        <div class="mb-3">
                            <label for="nomeAluno" class="form-label fw-bold">Nome do aluno</label>
                            <input type="text" id="nomeAluno" name="nomeAluno" class="form-control" required placeholder="Digite o nome do aluno">
                        </div>
                        <!--Primeira nota-->
                        <div class="mb-3">
                            <label for="nota1" class="form-label fw-bold">Primeira nota</label>
                            <input type="number" id="nota1" name="nota1" class="notas" min="0" max="10" step="0.1" required placeholder="Digite a nota"
                                oninput="media()" onkeydown="filtrarTeclas(event)">
                        </div>
                        <!--Segunda nota-->
                        <div class="mb-3">
                            <label for="nota2" class="form-label fw-bold">Segunda nota</label>
                            <input type="number" id="nota2" name="nota2" class="notas" min="0" max="10" step="0.1" required placeholder="Digite a nota"
                                oninput="media()" onkeydown="filtrarTeclas(event)">
                        </div>
                        <!--Terceira nota-->
                        <div class="mb-3">
                            <label for="nota3" class="form-label fw-bold">Terceira nota</label>
                            <input type="number" id="nota3" name="nota3" class="notas" min="0" max="10" step="0.1" required placeholder="Digite a nota"
                                oninput="media()" onkeydown="filtrarTeclas(event)">
                        </div>
                        <!--Quarta nota-->
                        <div class="mb-3">
                            <label for="nota4" class="form-label fw-bold">Quarta nota</label>
                            <input type="number" id="nota4" name="nota4" class="notas" min="0" max="10" step="0.1" required placeholder="Digite a nota"
                                oninput="media()" onkeydown="filtrarTeclas(event)">

                        </div>
                        <p>A média da sua nota é: <span id="result">??</span></p>
                        <p>
                            <button type="submit">Registrar resultado</button>
                        </p>
                        <p><span id="rst"> </span></p>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<body>
    <script src="js/script3.js"></script>
</body>


</html>
